<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HG Japan Car List</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 15px; text-align: center; }
        h1 { color: #333; font-size: 22px; }
        .car-list { display: flex; flex-direction: column; gap: 10px; max-width: 400px; margin: 0 auto; }
        .car-item { background: #fff; padding: 12px; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: bold; text-align: left; }
        .car-item:hover { background: #e0e0e0; }
        .details-box { background: #fff; margin-top: 20px; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; max-width: 400px; margin-left: auto; margin-right: auto; text-align: left; }
        .details-box img { width: 100%; border-radius: 6px; height: 200px; object-fit: cover; }
        .price { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

    <h1>HG Japan Car Listings</h1>
    <p>ကြိုက်နှစ်သက်ရာ ကားကိုနှိပ်၍ အသေးစိတ်ကြည့်ပါ။</p>

    <!-- ကားအမျိုးအစားများ List -->
    <div class="car-list">
        <div class="car-item" onclick="showCar('prius')">🚗 Toyota Prius (2018)</div>
        <div class="car-item" onclick="showCar('fit')">🚗 Honda Fit (2017)</div>
        <div class="car-item" onclick="showCar('crown')">🚗 Toyota Crown Athlete</div>
    </div>

    <!-- နှိပ်လိုက်ရင် အချက်အလက်ပေါ်လာမည့် နေရာ -->
    <div id="carDetails" class="details-box">
        <img id="carImg" src="" alt="Car Image">
        <h3 id="carTitle"></h3>
        <p><b>Grade:</b> <span id="carGrade"></span></p>
        <p><b>Mileage:</b> <span id="carMileage"></span></p>
        <p><b>Price:</b> <span id="carPrice" class="price"></span></p>
    </div>

    <script>
        // ကားအချက်အလက် ဒေတာများ
        const carsData = {
            prius: {
                title: "Toyota Prius 2018",
                grade: "S Touring Selection",
                mileage: "65,000 km",
                price: "သိန်း ၇၀၀ ကျော်",
                image: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=500"
            },
            fit: {
                title: "Honda Fit 2017",
                grade: "F Package",
                mileage: "52,000 km",
                price: "သိန်း ၅၀၀ ကျော်",
                image: "https://images.unsplash.com/photo-1590362891991-f776e747a588?w=500"
            },
            crown: {
                title: "Toyota Crown Athlete",
                grade: "G-Executive",
                mileage: "70,000 km",
                price: "သိန်း ၁၂၀၀ ကျော်",
                image: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=500"
            }
        };

        function showCar(carKey) {
            const car = carsData[carKey];
            if (car) {
                document.getElementById('carImg').src = car.image;
                document.getElementById('carTitle').innerText = car.title;
                document.getElementById('carGrade').innerText = car.grade;
                document.getElementById('carMileage').innerText = car.mileage;
                document.getElementById('carPrice').innerText = car.price;
                
                // အကွက်လေးကို ပေါ်လာစေရန်
                document.getElementById('carDetails').style.display = 'block';
            }
        }
    </script>

</body>
</html>
