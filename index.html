<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Data Form</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #2481cc; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1b65a6; }
    </style>
</head>
<body>

    <h2>🚗 ကားအချက်အလက် ဖြည့်သွင်းရန်</h2>
    
    <div class="form-group">
        <label>ကားအမျိုးအစား (Brand):</label>
        <input type="text" id="brand" placeholder="ဥပမာ - Toyota">
    </div>
    
    <div class="form-group">
        <label>မော်ဒယ် (Model):</label>
        <input type="text" id="model" placeholder="ဥပမာ - Crown">
    </div>
    
    <div class="form-group">
        <label>ဈေးနှုန်း (Price):</label>
        <input type="text" id="price" placeholder="ဥပမာ - 350 Lakhs">
    </div>
    
    <button onclick="submitData()">💾 ဒေတာသိမ်းမည်</button>

    <script>
        // Telegram Web App ကို ချိတ်ဆက်ခြင်း
        let tg = window.Telegram.WebApp;
        tg.expand();

        function submitData() {
            let brand = document.getElementById('brand').value.trim();
            let model = document.getElementById('model').value.trim();
            let price = document.getElementById('price').value.trim();

            if (!brand || !model || !price) {
                alert("ကျေးဇူးပြု၍ အချက်အလက်များ အားလုံး ဖြည့်ပါ။");
                return;
            }

            let carData = {
                brand: brand,
                model: model,
                price: price
            };

            // Telegram Bot ဆီသို့ Data ပို့ခြင်း
            tg.sendData(JSON.stringify(carData));
            tg.close();
        }
    </script>

</body>
</html>
